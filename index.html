<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Escapes Travel Curators | Crafted Journeys</title>
  <link rel="stylesheet" href="style.css">
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;700&family=Lato:wght@300;400&display=swap" rel="stylesheet">
</head>
<body>
  <!-- Hero Section -->
  <section class="hero">
    <div class="hero-content">
      <h1>Crafting trips with love and care, <span>Escapes makes every journey rare.</span></h1>
      <a href="#inquiry-form" class="cta-button">Plan Your Escape</a>
    </div>
  </section>

  <!-- Services Teaser -->
  <section class="services">
    <h2>Our Services</h2>
    <div class="service-grid">
      <div class="service-card">
        <img src="assets/icons/visa.svg" alt="Visa Assistance">
        <h3>Visa Assistance</h3>
        <p>Stress-free processing with expert support.</p>
      </div>
      <!-- Add 4 more cards (Flights, Hotels, Packages, Cars) -->
    </div>
  </section>

  <!-- Inquiry Form (Anchor target) -->
  <section id="inquiry-form" class="inquiry-form">
    <h2>Start Your Journey</h2>
    <form>
      <input type="text" placeholder="Name" required>
      <input type="email" placeholder="Email" required>
      <select>
        <option value="" disabled selected>Trip Type</option>
        <option>Beach Escape</option>
        <option>Cultural Adventure</option>
      </select>
      <button type="submit">Submit Inquiry</button>
    </form>
  </section>

  <!-- WhatsApp Float -->
  <a href="https://wa.me/919780091116" class="whatsapp-float">
    <img src="assets/icons/whatsapp.svg" alt="Chat on WhatsApp">
  </a>

  <script src="script.js"></script>
</body>
</html>
